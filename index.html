<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comparador de Súper - Barranquilla</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Aviso de precios de ejemplo -->
  <div class="aviso-ejemplo">
    Precios de ejemplo, versión de prueba
  </div>

  <!-- Encabezado -->
  <header class="encabezado">
    <h1>Comparador de Súper</h1>
    <p class="subtitulo">Compara precios entre Éxito, D1 y Olímpica en Barranquilla</p>
  </header>

  <!-- Buscador -->
  <section class="buscador-seccion">
    <label for="buscador" class="buscador-label">Buscar producto</label>
    <input 
      type="text" 
      id="buscador" 
      class="buscador-input" 
      placeholder="Escribe el nombre del producto (ej: leche, arroz)"
      autocomplete="off"
    >
  </section>

  <!-- Título de resultados -->
  <section class="resultados-seccion">
    <h2 id="titulo-resultados" class="titulo-resultados">Productos de ejemplo</h2>
    <div id="lista-productos" class="lista-productos">
      <!-- Los productos se cargan con JavaScript -->
    </div>
  </section>

  <!-- Archivos JavaScript -->
  <script src="precios.js"></script>
  <script src="app.js"></script>
</body>
</html>
